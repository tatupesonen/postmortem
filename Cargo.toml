[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://example.invalid/postmortem"
authors = ["postmortem contributors"]

[workspace.dependencies]
# Internal crates
pm-core = { path = "crates/pm-core" }
pm-testkit = { path = "crates/pm-testkit" }
pm-volume = { path = "crates/pm-volume" }
pm-image = { path = "crates/pm-image" }
pm-fs = { path = "crates/pm-fs" }
pm-fs-fat = { path = "crates/pm-fs-fat" }
pm-fs-ntfs = { path = "crates/pm-fs-ntfs" }
pm-evidence = { path = "crates/pm-evidence" }
pm-ui = { path = "crates/pm-ui" }

# Foundations
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
bitflags = "2.13.2"
jiff = "0.2.38"
memmap2 = "0.9.11"
rayon = "1.12.0"
crossbeam-channel = "0.5.17"
parking_lot = "0.12.5"
crc32fast = "1.5.2"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
uuid = "1.28.0"

# GUI
egui = "0.36.2"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "accesskit", "default_fonts", "persistence", "wayland", "x11"] }
egui_extras = { version = "0.36.2", default-features = false, features = ["image"] }
rfd = "0.17.2"
image = { version = "0.25.10", default-features = false, features = ["rayon", "jpeg", "png", "gif", "webp", "tiff", "bmp", "ico"] }
serde = { version = "1.0.229", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Testing
proptest = "1.12.0"
rstest = "0.27.0"
insta = "1.49.0"
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }
tempfile = "3.27.0"
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
ntfs = "0.4.0"
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight forensic/binary-parsing code more than they help.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
# Correctness-adjacent restrictions we do want.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"

[profile.dev]
# Parsers and hashing are painfully slow unoptimised; keep debug info but
# optimise dependencies.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"
