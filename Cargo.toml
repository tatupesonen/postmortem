[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.2.5"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tatupesonen/postmortem"
# Internal crates are not published; pm-plugin-api and pm-plugin-sdk opt out.
publish = false
authors = ["postmortem contributors"]

[workspace.dependencies]
# Internal crates
pm-core = { path = "crates/pm-core" }
pm-testkit = { path = "crates/pm-testkit" }
pm-volume = { path = "crates/pm-volume" }
pm-image = { path = "crates/pm-image" }
pm-fs = { path = "crates/pm-fs" }
pm-fs-fat = { path = "crates/pm-fs-fat" }
pm-fs-ntfs = { path = "crates/pm-fs-ntfs" }
pm-fs-exfat = { path = "crates/pm-fs-exfat" }
pm-fs-ext = { path = "crates/pm-fs-ext" }
pm-evidence = { path = "crates/pm-evidence" }
pm-timeline = { path = "crates/pm-timeline" }
pm-discovery = { path = "crates/pm-discovery" }
pm-casedb = { path = "crates/pm-casedb" }
pm-case = { path = "crates/pm-case" }
pm-ingest = { path = "crates/pm-ingest" }
pm-modules = { path = "crates/pm-modules" }
pm-hashdb = { path = "crates/pm-hashdb" }
pm-filetype = { path = "crates/pm-filetype" }
pm-encryption = { path = "crates/pm-encryption" }
pm-rules = { path = "crates/pm-rules" }
pm-evtlog = { path = "crates/pm-evtlog" }
pm-ui = { path = "crates/pm-ui" }
pm-registry = { path = "crates/pm-registry" }
pm-lnk = { path = "crates/pm-lnk" }
pm-prefetch = { path = "crates/pm-prefetch" }
pm-winartifacts = { path = "crates/pm-winartifacts" }
pm-archive = { path = "crates/pm-archive" }
pm-carve = { path = "crates/pm-carve" }
pm-text = { path = "crates/pm-text" }
pm-search = { path = "crates/pm-search" }
pm-plugin-api = { path = "crates/pm-plugin-api" }
pm-plugin-wasm = { path = "crates/pm-plugin-wasm" }
pm-plugin-sdk = { path = "crates/pm-plugin-sdk" }
pm-report = { path = "crates/pm-report" }
pm-email = { path = "crates/pm-email" }
pm-geo = { path = "crates/pm-geo" }
pm-browser = { path = "crates/pm-browser" }
pm-mcp = { path = "crates/pm-mcp" }

# MCP server (pm-mcp, ADR-021)
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "io-std", "net", "time", "sync"] }
base64 = "0.22.1"

# Foundations
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
bitflags = "2.13.2"
jiff = "0.2.38"
memmap2 = "0.9.11"
rayon = "1.12.0"
crossbeam-channel = "0.5.17"
parking_lot = "0.12.5"
crc32fast = "1.5.2"
regex = "1.13.1"
memchr = "2.8.3"
roxmltree = "0.21.1"
aes = "0.9.3"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
uuid = "1.28.0"

# Archives, embedded files and carving (pm-archive, pm-carve)
aho-corasick = "1.1.5"
encoding_rs = "0.8.35"
chardetng = "1.0.0"
bzip2 = "0.6.1"
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "xz", "optimization"] }
ruzstd = "0.9.0"
sevenz-rust2 = { version = "0.23.0", default-features = false, features = ["aes256", "bzip2", "ppmd", "deflate"] }
rars = "0.9.4"

# GUI
egui = "0.36.2"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "accesskit", "default_fonts", "persistence", "wayland", "x11"] }
egui_extras = { version = "0.36.2", default-features = false, features = ["image"] }
rfd = "0.17.2"
image = { version = "0.25.10", default-features = false, features = ["rayon", "jpeg", "png", "gif", "webp", "tiff", "bmp", "ico"] }
serde = { version = "1.0.229", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
resvg = "0.48.1"
rusqlite = { version = "0.40.2", features = ["bundled", "blob", "backup", "functions", "hooks", "limits", "window"] }
serde_json = "1.0.154"
toml = "1.1.8"

# Testing
proptest = "1.12.0"
rstest = "0.27.0"
insta = "1.49.0"
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }
# Glyph coverage checks of egui's bundled fonts (tests).
epaint_default_fonts = "0.36.2"
skrifa = "0.44.0"
tempfile = "3.27.0"
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
ntfs = "0.4.0"
# Fixture writer for ext/XFS/HFS+/ISO tests; API unstable before 0.5 → pin exactly.
fstool = { version = "=0.4.35", default-features = false, features = ["std", "ext", "hfs-plus", "iso9660", "xfs"] }
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight forensic/binary-parsing code more than they help.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
# Correctness-adjacent restrictions we do want.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"

[profile.dev]
# Parsers and hashing are painfully slow unoptimised; keep debug info but
# optimise dependencies.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Published binaries (GitHub releases): full optimisation and no debug
# information. `release` keeps line tables for profiling and readable
# backtraces on the developer machine.
[profile.dist]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"

[profile.bench]
inherits = "release"
