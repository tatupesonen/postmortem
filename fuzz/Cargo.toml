[package]
name = "pm-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
pm-core = { path = "../crates/pm-core" }
pm-volume = { path = "../crates/pm-volume" }
pm-fs = { path = "../crates/pm-fs" }
pm-fs-fat = { path = "../crates/pm-fs-fat" }
pm-image = { path = "../crates/pm-image" }
pm-fs-ntfs = { path = "../crates/pm-fs-ntfs" }
pm-fs-exfat = { path = "../crates/pm-fs-exfat" }
pm-evtlog = { path = "../crates/pm-evtlog" }
pm-registry = { path = "../crates/pm-registry" }
pm-lnk = { path = "../crates/pm-lnk" }
pm-prefetch = { path = "../crates/pm-prefetch" }
pm-filetype = { path = "../crates/pm-filetype" }
pm-archive = { path = "../crates/pm-archive" }
pm-carve = { path = "../crates/pm-carve" }
pm-text = { path = "../crates/pm-text" }
pm-search = { path = "../crates/pm-search" }

[workspace]
members = ["."]

