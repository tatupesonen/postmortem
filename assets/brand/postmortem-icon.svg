      <line x1="324.8" y1="251.2" x2="301.2" y2="226.8"/>
      <line x1="290.9" y1="283.4" x2="267.8" y2="258.4"/>
      <line x1="273.0" y1="326.0" x2="239.0" y2="326.0"/>
      <line x1="273.0" y1="360.0" x2="239.0" y2="360.0"/>
      <line x1="273.0" y1="394.0" x2="239.0" y2="394.0"/>
