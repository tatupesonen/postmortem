<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>postmortem</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#232838"/>
      <stop offset="1" stop-color="#0A0C12"/>
    </radialGradient>
    <radialGradient id="platter" cx="40%" cy="32%" r="80%">
      <stop offset="0" stop-color="#F4F6FA"/>
      <stop offset="0.45" stop-color="#B9C1CF"/>
      <stop offset="1" stop-color="#5E6779"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="cut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A6E"/>
      <stop offset="1" stop-color="#E5173F"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- platter -->
  <circle cx="262" cy="270" r="184" fill="#000" opacity="0.45" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="184" fill="url(#platter)"/>
  <g fill="none" stroke="#3A4152" stroke-opacity="0.22" stroke-width="2">
    <circle cx="256" cy="256" r="162"/>
    <circle cx="256" cy="256" r="138"/>
    <circle cx="256" cy="256" r="112"/>
    <circle cx="256" cy="256" r="86"/>
  </g>
  <circle cx="256" cy="256" r="184" fill="url(#sheen)"/>
  <circle cx="256" cy="256" r="184" fill="none" stroke="#0A0C12" stroke-opacity="0.35" stroke-width="3"/>
  <!-- spindle -->
  <circle cx="256" cy="226" r="30" fill="#2A3040"/>
  <circle cx="256" cy="226" r="30" fill="none" stroke="#C9D0DC" stroke-width="4"/>
  <circle cx="256" cy="226" r="9" fill="#C9D0DC"/>
  <!-- actuator arm -->
  <g>
    <path d="M436,438 L352,344 L340,356 L424,450 Z" fill="#000" opacity="0.35" filter="url(#shadow)"/>
    <path d="M444,430 L356,336 Q350,330 344,336 L338,342 Q332,348 338,354 L426,448 Z" fill="#8A93A5"/>
    <path d="M444,430 L356,336 Q350,330 344,336 L341,339 L432,436 Z" fill="#B7BFCC"/>
    <rect x="322" y="318" width="34" height="24" rx="5" transform="rotate(43 339 330)" fill="#2A3040"/>
    <circle cx="436" cy="440" r="24" fill="#1B1F2A"/>
    <circle cx="436" cy="440" r="13" fill="#9AA3B4"/>
  </g>
  <!-- Y incision -->
  <path d="M128,168 Q206,248 256,292 M384,168 Q306,248 256,292 M256,292 L256,428" fill="none" stroke="#FF2D55" stroke-opacity="0.55" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M128,168 Q206,248 256,292 M384,168 Q306,248 256,292 M256,292 L256,428" fill="none" stroke="url(#cut)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#F7F9FC" stroke-width="8" stroke-linecap="round">
      <line x1="173.0" y1="189.5" x2="148.9" y2="213.5"/>
