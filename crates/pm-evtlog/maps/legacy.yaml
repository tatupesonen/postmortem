# postmortem maps for legacy .evt logs (Windows NT/2000/XP/2003).
# Values '#N' are the N-th insertion string; positions follow Microsoft's
# Windows Server 2003 security event documentation.
---
Description: "Successful logon"
EventId: 528
Channel: Security
Provider: Security
Maps:
  -
    Property: UserName
    PropertyValue: "%domain%\\%user%"
    Values:
      -
        Name: domain
        Value: "#2"
      -
        Name: user
        Value: "#1"
  -
    Property: RemoteHost
    PropertyValue: "%workstation% (%address%)"
    Values:
      -
        Name: workstation
        Value: "#7"
      -
        Name: address
        Value: "#14"
  -
    Property: PayloadData1
    PropertyValue: "LogonType %LogonType%"
    Values:
      -
        Name: LogonType
        Value: "#4"
  -
    Property: PayloadData2
    PropertyValue: "LogonId: %LogonId%"
    Values:
      -
        Name: LogonId
        Value: "#3"
  -
    Property: PayloadData3
    PropertyValue: "LogonProcess: %proc% AuthPackage: %pkg%"
    Values:
      -
        Name: proc
        Value: "#5"
      -
        Name: pkg
        Value: "#6"
Lookups:
  -
    Name: LogonType
    Default: Unknown logon type
    Values:
      2: Interactive
      3: Network
      4: Batch
      5: Service
      7: Unlock
      8: NetworkCleartext
      9: NewCredentials
      10: RemoteInteractive
      11: CachedInteractive
