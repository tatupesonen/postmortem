[package]
name = "pm-plugin-sdk"
description = "Write postmortem plugins in Rust: implement pm-plugin-api's traits and export them as a WebAssembly component with export_plugin!"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"

[dependencies]
pm-plugin-api.workspace = true
serde_json.workspace = true
wit-bindgen = { version = "=0.57.1", default-features = false, features = ["macros", "realloc"] }

# Generated bindings need `unsafe`, which the workspace forbids; the rest
# follows the workspace rules.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
