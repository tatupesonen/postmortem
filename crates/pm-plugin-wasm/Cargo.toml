wasmtime = { version = "=45.0.3", default-features = false, features = ["std", "runtime", "cranelift", "component-model"] }
wasmtime-wasi = { version = "=45.0.3", default-features = false, features = ["p2"] }
toml = "0.9"

[dev-dependencies]
tempfile.workspace = true

