[package]
name = "pm-browser"
description = "Web browser artefact parsers for postmortem: Chromium, Firefox, Safari, Internet Explorer (index.dat), Edge legacy, Chrome cache, Safari binary cookies, URL analytics (domains, search queries, web account roles, domain categories)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Writers for index.dat, Cookies.binarycookies and Chrome cache files
# (tests, fuzz seeds).
testing = []

[dependencies]
pm-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
regex.workspace = true
flate2.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
plist = { version = "=1.10.1", default-features = false }

[dev-dependencies]
pm-browser = { path = ".", features = ["testing"] }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
