[package]
name = "probe"
description = "Test plugin: exercises every host call, a panic and fuel exhaustion"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Built on its own (not part of the postmortem workspace):
#   cargo build --release --target wasm32-wasip2
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
pm-plugin-sdk = { path = "../../../crates/pm-plugin-sdk" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
